<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cinemux — play MKV in the browser</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1f1f1f;
        --surface: #1c1c1e;
        --border: rgb(255 255 255 / 0.18);
        --text: rgb(255 255 255 / 0.92);
        --soft: rgb(255 255 255 / 0.64);
        --faint: rgb(255 255 255 / 0.4);
        --accent: #0a84ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 40px 24px 64px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 900px; margin: 0 auto; }
      h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
      p.subtitle { color: var(--soft); margin: 0 0 28px; }
      code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.92em; }

      .dropzone {
        border: 1px dashed var(--border);
        border-radius: 14px;
        padding: 28px;
        text-align: center;
        color: var(--soft);
        transition: border-color 0.2s, background 0.2s;
      }
      .dropzone.hover { border-color: var(--accent); background: rgb(10 132 255 / 0.08); }

      video {
        width: 100%;
        margin-top: 20px;
        background: #000;
        border-radius: 12px;
        display: none;
      }
      video.visible { display: block; }

      table { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: 13px; }
      th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid rgb(255 255 255 / 0.08); }
      th { color: var(--faint); font-weight: 500; width: 190px; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
      .yes { background: #34d399; } .no { background: #f87171; } .maybe { background: #fbbf24; }
      #log {
        margin-top: 20px; padding: 14px; border-radius: 10px; background: var(--surface);
        font-family: ui-monospace, monospace; font-size: 12px; color: var(--soft);
        white-space: pre-wrap; max-height: 220px; overflow: auto;
      }
      .error { color: #f87171; }
    </style>
  </head>
  <body>
    <main>
      <h1>cinemux</h1>
      <p class="subtitle">
        Matroska → fragmented MP4 remux, in the browser. No WASM, no transcoding.
      </p>

      <div class="dropzone" id="dropzone">
        Drop an <code>.mkv</code> file here, or
        <label style="color: var(--accent); cursor: pointer">
          pick one<input type="file" id="file" accept=".mkv,.webm,video/*" hidden />
        </label>
      </div>

      <video id="video" controls playsinline></video>

      <table id="info" hidden>
        <tbody id="infoBody"></tbody>
      </table>

      <div id="log"></div>
    </main>

    <script type="module">
      import { Cinemux, BlobSource, availableCodecs, browserCompatible } from "../dist/index.js";

      const dropzone = document.getElementById("dropzone");
      const video = document.getElementById("video");
      const log = document.getElementById("log");
      const info = document.getElementById("info");
      const infoBody = document.getElementById("infoBody");

      const note = (text, error = false) => {
        const line = document.createElement("div");
        if (error) line.className = "error";
        line.textContent = text;
        log.append(line);
        log.scrollTop = log.scrollHeight;
      };

      const row = (key, value) => {
        const tr = document.createElement("tr");
        const th = document.createElement("th");
        th.textContent = key;
        const td = document.createElement("td");
        if (value instanceof Node) td.append(value);
        else td.textContent = value;
        tr.append(th, td);
        infoBody.append(tr);
      };

      if (!browserCompatible()) {
        note("MediaSource unavailable: this browser can't play MKV via remux.", true);
      } else {
        const available = availableCodecs();
        note("codecs decodable here: " + Object.entries(available)
          .map(([k, v]) => `${k}=${v ? "yes" : "no"}`).join("  "));
      }

      let player = null;

      async function open(file) {
        player?.detach();
        infoBody.replaceChildren();
        log.replaceChildren();
        info.hidden = true;

        note(`opening ${file.name} (${(file.size / 1048576).toFixed(1)} MB)`);
        const t0 = performance.now();

        try {
          player = await Cinemux.attach(video, new BlobSource(file), {
            preferredLanguage: "en",
            onDiagnostic: (d) => {
              const ms = Math.round(performance.now() - t0);
              note(`tracks recognized in ${ms} ms — ${d.mime}`);

              info.hidden = false;
              row("MIME type", d.mime);
              row("Duration", d.durationMs ? `${(d.durationMs / 1000).toFixed(1)} s` : "unknown");
              for (const [name, choice] of [["Video", d.video], ["Audio", d.audio]]) {
                if (!choice) { row(name, "none"); continue; }
                const span = document.createElement("span");
                const dot = document.createElement("span");
                dot.className = "dot " + (choice.supported ? "yes" : "no");
                span.append(dot, document.createTextNode(
                  `${choice.track.codecId} → ${choice.description.codec}` +
                  (choice.track.language !== "und" ? ` · ${choice.track.language}` : "") +
                  (choice.supported ? "" : " · not decodable here"),
                ));
                row(name, span);
              }
              if (d.discarded.length) {
                row("Discarded tracks", d.discarded
                  .map((t) => `${t.track.codecId} (${t.reason})`).join(" · "));
              }
            },
            onError: (e) => note("error: " + e.message, true),
          });

          video.classList.add("visible");
          row("Seek", player.seekable ? "Cues index found" : "no index (linear playback)");

          video.addEventListener("loadeddata", () => {
            note(`first frame shown in ${Math.round(performance.now() - t0)} ms`);
          }, { once: true });
          video.addEventListener("error", () => {
            note("<video> rejected the stream: " + (video.error?.message ?? "?"), true);
          });
        } catch (e) {
          note("failed: " + e.message, true);
        }
      }

      document.getElementById("file").addEventListener("change", (e) => {
        if (e.target.files?.[0]) open(e.target.files[0]);
      });
      dropzone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropzone.classList.add("hover");
      });
      dropzone.addEventListener("dragleave", () => dropzone.classList.remove("hover"));
      dropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.classList.remove("hover");
        if (e.dataTransfer.files?.[0]) open(e.dataTransfer.files[0]);
      });

      // Lets an automated test load a file by URL.
      const params = new URLSearchParams(location.search);
      const url = params.get("url");
      if (url) {
        const { HttpSource } = await import("../dist/index.js");
        player?.detach();
        note(`opening by URL: ${url}`);
        const t0 = performance.now();
        try {
          player = await Cinemux.attach(video, new HttpSource(url), {
            preferredLanguage: "en",
            onDiagnostic: (d) => {
              window.__diag = d;
              note(`tracks recognized in ${Math.round(performance.now() - t0)} ms — ${d.mime}`);
              info.hidden = false;
              row("MIME type", d.mime);
              row("Video", d.video ? `${d.video.track.codecId} → ${d.video.description.codec}` : "none");
              row("Audio", d.audio ? `${d.audio.track.codecId} → ${d.audio.description.codec}` : "none");
            },
            onError: (e) => { window.__error = e.message; note("error: " + e.message, true); },
          });
          video.classList.add("visible");
          window.__ready = true;
        } catch (e) {
          window.__error = e.message;
          note("failed: " + e.message, true);
        }
      }
    </script>
  </body>
</html>
